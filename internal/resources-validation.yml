jobs:
# Spin up a Linux VM for validating code.
- job: png_resources_validation
  displayName: Resources Validation
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - script: |
        if [ ! -d "$(Build.SourcesDirectory)/resources" ]; then
          echo "No resources directory found, skipping job steps."
          echo "##vso[task.setvariable variable=resourcesExist]false"
        else
          echo "Resources directory found."
          echo "##vso[task.setvariable variable=resourcesExist]true"
        fi
      displayName: 'Check for resources'

    # Reimplements the 'known incorrect sRGB profile' check removed in libpng 1.6.47,
    # which pngcrush relied on. Inlined so it doesn't depend on tk_ci_tools_ref.
    - script: |
        cat > "$(Agent.TempDirectory)/check_png_profile.py" <<'EOF'
        import struct
        import sys
        import zlib

        # (adler32, crc32, length) of the profiles libpng flagged as broken.
        KNOWN_INCORRECT_PROFILES = {
            (0x0398F3FC, 0xF29E526D, 3144),  # HP-Microsoft sRGB v2 media-relative
            (0xF784F3FB, 0x182EA552, 3144),  # HP-Microsoft sRGB v2 perceptual
        }
        # Longer profiles can't match, so only keep this many decompressed bytes.
        MAX_PROFILE_LENGTH = max(length for _, _, length in KNOWN_INCORRECT_PROFILES)
        # libpng's default PNG_USER_CHUNK_MALLOC_MAX, guards against zip bombs.
        MAX_INFLATE_LENGTH = 8000000

        path = sys.argv[1]
        with open(path, "rb") as f:
            data = f.read()

        pos = 8
        while pos + 8 <= len(data):
            length, chunk_type = struct.unpack(">I4s", data[pos : pos + 8])
            if chunk_type == b"IDAT":
                break
            if chunk_type == b"iCCP":
                body = data[pos + 8 : pos + 8 + length]
                decompressor = zlib.decompressobj()
                try:
                    profile = decompressor.decompress(
                        body.partition(b"\x00")[2][1:], MAX_PROFILE_LENGTH + 1
                    )
                    # Drain the rest in bounded chunks to validate the whole stream.
                    total = len(profile)
                    while not decompressor.eof and total <= MAX_INFLATE_LENGTH:
                        chunk = decompressor.decompress(
                            decompressor.unconsumed_tail, 65536
                        )
                        if not chunk and not decompressor.unconsumed_tail:
                            break
                        total += len(chunk)
                except zlib.error as e:
                    print("%s: iCCP: corrupt profile: %s" % (path, e))
                    break
                if total > MAX_INFLATE_LENGTH:
                    print(
                        "%s: iCCP: profile exceeds %d bytes"
                        % (path, MAX_INFLATE_LENGTH)
                    )
                    break
                if not decompressor.eof:
                    print("%s: iCCP: corrupt profile: truncated stream" % path)
                    break
                key = (zlib.adler32(profile), zlib.crc32(profile), len(profile))
                if key in KNOWN_INCORRECT_PROFILES:
                    print("%s: iCCP: known incorrect sRGB profile" % path)
                break
            pos += 12 + length
        EOF
        echo "PNG profile checker saved to $(Agent.TempDirectory)/check_png_profile.py"
      displayName: 'Write PNG profile checker'
      condition: eq(variables['resourcesExist'], 'true')

    # Allows us to easily skip when cloning tk-ci-tools inside the tk-ci-tools repo.
    - bash: |
        git clone --depth 1 --branch ${{ parameters.tk_ci_tools_ref }} https://github.com/shotgunsoftware/tk-ci-tools ../tk-ci-tools
      displayName: 'Clone tk-ci-tools'
      condition: and(eq(variables['resourcesExist'], 'true'), ne(variables['Build.Repository.Name'], 'shotgunsoftware/tk-ci-tools'))

    - script: |
        # Set the path to the tk-ci-tools repo, which is either the current directory
        # if the job is running in the ci-tools repository, or the tk-ci-tools directory otherwise
        repo_name=$(basename "${{ variables['Build.Repository.Name'] }}")
        if [ "$repo_name" = 'tk-ci-tools' ]; then
          ci_tools_path="."
        else
          ci_tools_path="../tk-ci-tools"
        fi
        echo "ci_tools_path=$ci_tools_path"

        function validate_png {
          filepath=$1
          filename=$(basename $filepath)
          expected_fail=$2
          output=$(python3 "$(Agent.TempDirectory)/check_png_profile.py" "$filepath" 2>&1)
          echo "$output"
          if [[ "$output" == *"iCCP:"* ]]; then
            if $expected_fail; then
                echo "Success: $filename is invalid as expected"
            else
                echo "Error: $filename validation expected to succeed failed, please consider using an optimizing PNG image tool like mogrify to fix or strip the incorrect profiles."
                exit 1
            fi
          else
            if $expected_fail; then
                echo "Error: $filename validation expected to fail passed, please check the PNG profile checker."
                exit 1
            else
                echo "Success: $filename is valid as expected"
            fi
          fi
        }

        validate_png "$ci_tools_path/tests/test_images/good_profile.png" false
        validate_png "$ci_tools_path/tests/test_images/wrong_profile.png" true
      displayName: 'Validate Test Images'
      condition: eq(variables['resourcesExist'], 'true')

    - script: |
        # Initialize error counter and error messages
        errors=0
        error_messages=""

        # Run the profile checker on PNG files and check for errors
        for file in $(find . -type f -name "*.png"); do
          output=$(python3 "$(Agent.TempDirectory)/check_png_profile.py" "$file" 2>&1)
          echo "$output"
          if [[ "$output" == *"iCCP:"* ]]; then
              errors=$((errors + 1))
              error_messages+="$output\n"
          fi
        done

        # If there were any errors, print custom message and error messages
        if [ $errors -gt 0 ]; then
          echo -e "\nThe following PNG files have profile errors. Consider using an optimizing PNG image tool like mogrify to fix or strip the incorrect profiles:\n"
          echo -e "$error_messages"
          exit $(($errors > 254 ? 254 : $errors))
        fi
      displayName: 'Process PNG files'
      workingDirectory: $(Build.SourcesDirectory)/resources
      condition: eq(variables['resourcesExist'], 'true')
