parameters:
  # List of Python packages that need to be pip installed for testing.
  - name: extra_test_dependencies
    type: object
    default: []
  # Git ref of tk-toolchain to use.
  - name: tk_toolchain_ref
    type: string
    default: master
  # List of repositories to clone alongside this repository.
  # To clone the tk-framework-shotgunutils's master branch
  # and a specific tk-framework-qtwidget ref, you would
  # set this parameter to the following:
  # - name: tk-framework-shotgunutils
  # - name: tk-framework-qtwidgets
  #   ref: <branch-or-tag>
  - name: additional_repositories
    type: object
    default: []
  # Git ref of tk-core to use.
  - name: tk_core_ref
    type: string
    default: master
  # Post test steps
  # This is a list of Azure Pipeline steps that will be inserted
  # right after the tests were run.
  # If you wanted to run a non-standard suite of test as an extra
  # you would specify post_tests_steps as:
  # post_tests_steps:
  # - bash: do_something
  # - bash: do_something_else
  - name: post_tests_steps
    type: object
    default: []
  # If set to true, the build agent will run unit tests.
  - name: has_unit_tests
    type: boolean
    default: true

  # The repository is a Toolkit component: install the Qt wrapper and
  # tk-toolchain, clone tk-core and set up a display for Qt on Linux. Turn it
  # off for repositories that are not Toolkit components.
  - name: toolkit
    type: boolean
    default: true

  # Measure the code coverage, publish it to Azure Pipelines and upload it to
  # Codecov. Turn it off for repositories whose tests don't exercise the code of
  # the repository itself.
  - name: coverage
    type: boolean
    default: true

  # Steps run right before the tests, in every test job.
  - name: pre_steps
    type: object
    default: []

  # Extra environment variables for the tests. Map secrets here, e.g.
  # SG_API_KEY: $(my_secret). The job variables $(tk_ci_os_name) and
  # $(tk_ci_python_version) can be used in the values.
  - name: env
    type: object
    default: {}

  # Extra arguments for pytest, e.g. [--reruns, '1'].
  - name: pytest_args
    type: object
    default: []

  # Platforms to test with: a Python version and the Qt wrapper to install.
  # The Qt wrapper is ignored when toolkit is false.
  # Each platform is tested on every OS of os_versions, with the OS default
  # image. To use another image for an OS, or not test on it, list only that
  # OS in the platform's os_versions:
  #   os_versions:
  #     Linux: ubuntu-24.04
  #     macOS: skip
  - name: platforms
    type: object
    default:
      - name: VFX CY2022
        python_version: '3.9'
        qt_wrapper: PySide2==5.15.2.1
        os_versions:
          # ubuntu-latest (Ubuntu 26.04) does not provide Python 3.9
          Linux: ubuntu-24.04

      - name: VFX CY2023
        python_version: '3.10'
        qt_wrapper: PySide2==5.15.2.1

      - name: VFX CY2024
        python_version: '3.11'
        qt_wrapper: PySide6~=6.6.3
        # Not using the real VFX Qt version: 6.5.
        # Because ~6.5.2 has problem with core ci
        # Also 6.6.1 has a random bug (SG-38086).

      - name: VFX CY2026
        python_version: '3.13'
        qt_wrapper: PySide6~=6.8.3

  # Operating systems to test on, with their default runner image.
  - name: os_versions
    type: object
    default:
      - name: Linux
        image: ubuntu-latest
        codecov_download_url: https://uploader.codecov.io/latest/linux/codecov

      - name: macOS
        image: macOS-latest
        codecov_download_url: https://uploader.codecov.io/v0.7.3/macos/codecov
        # macOS & codecov note:
        # In Nov 2024 (SG-36700), we pinned macOS to codecov v0.7.3 because the
        # macOS-14 Azure Pipelines agent is Intel (x86_64), but Codecov started
        # shipping arm64-only binaries.
        # When we will change the macOs image to a arm64 arch, we can use the
        # "latest" version again.

      - name: Windows
        image: windows-latest
        codecov_download_url: https://uploader.codecov.io/latest/windows/codecov.exe

jobs:
  - ${{ if eq( parameters.has_unit_tests, true ) }}:
    - ${{ each platform in parameters.platforms }}:
      - ${{ each os_version in parameters.os_versions }}:
        # Use the platform's image for this OS if it has one, else the OS default.
        - ${{ if ne(coalesce(platform.os_versions[os_version.name], os_version.image), 'skip') }}:
          - template: run-tests-with.yml
            parameters:
              codecov_download_url: ${{ os_version.codecov_download_url }}
              os_name: ${{ os_version.name }}
              python_version: ${{ platform.python_version }}
              qt_wrapper: ${{ platform.qt_wrapper }}
              vm_image: ${{ coalesce(platform.os_versions[os_version.name], os_version.image) }}

              # pass through all parameters
              extra_test_dependencies: ${{ parameters.extra_test_dependencies }}
              tk_toolchain_ref: ${{ parameters.tk_toolchain_ref }}
              additional_repositories: ${{ parameters.additional_repositories }}
              tk_core_ref: ${{ parameters.tk_core_ref }}
              post_tests_steps: ${{ parameters.post_tests_steps }}
              toolkit: ${{ parameters.toolkit }}
              coverage: ${{ parameters.coverage }}
              pre_steps: ${{ parameters.pre_steps }}
              env: ${{ parameters.env }}
              pytest_args: ${{ parameters.pytest_args }}
